name: Generate content

on:
  push:
    branches: [ master ]
    paths:
      - contents.json
      - .github/osia_convert.rb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Generate content
        env:
          TZ: UTC
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- contents.json)"
          export SOURCE_DATE_EPOCH
          bundle exec ruby .github/osia_convert.rb

      - name: Commit generated content
        run: |
          if git diff --quiet -- README.md APPSTORE.md ARCHIVE.md LATEST.md; then
            exit 0
          fi

          git config user.name "READMEbot"
          git config user.email "readmebot@users.noreply.github.com"
          git add README.md APPSTORE.md ARCHIVE.md LATEST.md
          git commit -m "[auto] [ci skip] Generate content"
          git push origin HEAD:master
